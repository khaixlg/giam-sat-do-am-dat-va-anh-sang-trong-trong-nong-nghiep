<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Dashboard Giám sát và Điều khiển IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-box {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-off {
            background-color: #f8d7da; /* Light Red */
            color: #721c24;
        }
        .status-on {
            background-color: #d4edda; /* Light Green */
            color: #155724;
        }
        .data-card {
            height: 100%;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Dashboard Giám sát và Điều khiển IoT</h1>

    <div class="row mb-5">
        <!-- Đèn LED Status -->
        <div class="col-md-6">
            <div class="status-box" id="led-status-box" th:classappend="${ledStatus == 1} ? 'status-on' : 'status-off'">
                <h2>Đèn LED</h2>
                <p class="lead" id="led-text" th:text="${ledStatus == 1} ? 'ĐANG BẬT' : 'ĐANG TẮT'">ĐANG TẮT</p>
                <input type="hidden" id="currentLedStatus" th:value="${ledStatus}">

                <div class="mt-3">
                    <button class="btn btn-success me-2" onclick="sendLedControl(1)">BẬT LED</button>
                    <button class="btn btn-danger" onclick="sendLedControl(0)">TẮT LED</button>
                </div>
            </div>
        </div>

        <!-- Còi Báo Động Status -->
        <div class="col-md-6">
            <div class="status-box" id="buzzer-status-box" th:classappend="${buzzerStatus == 1} ? 'status-on' : 'status-off'">
                <h2>Còi Báo Động</h2>
                <p class="lead" id="buzzer-text" th:text="${buzzerStatus == 1} ? 'ĐANG BẬT' : 'ĐANG TẮT'">ĐANG TẮT</p>
                <input type="hidden" id="currentBuzzerStatus" th:value="${buzzerStatus}">
            </div>
        </div>
    </div>

    <hr>

    <!-- Bảng Dữ Liệu Cảm Biến -->
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card data-card mb-4">
                <div class="card-header bg-secondary text-white">
                    <h4>Dữ liệu Cảm biến (Cập nhật tự động mỗi 3s)</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Ánh sáng (lux)</th>
                                <th>Độ ẩm (%)</th>
                            </tr>
                        </thead>
                        <tbody id="sensorDataTable">
                            <tr th:each="item : ${data}">
                                <td th:text="${#temporals.format(item.timestamp, 'dd-MM-yyyy HH:mm:ss')}">01-01-2024 10:00:00</td>
                                <td th:text="${item.light}">500.0</td>
                                <td th:text="${item.humidity}">50.0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
